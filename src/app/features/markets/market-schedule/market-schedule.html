<div class="scroller">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div class="max-w-[560px]">
      <h2 class="m-0 text-title-large font-bold text-on-surface">Trading pattern</h2>
      <p class="mt-1 mb-0 text-body-medium text-on-surface-variant">
        When this market trades, week after week. One-off closures and extra dates are set
        separately, on the market calendar.
      </p>
    </div>

    <div class="flex shrink-0 flex-wrap items-center gap-2">
      <button matButton type="button" [disabled]="busy() || !dirty()" (click)="reset()">
        Discard changes
      </button>
      <button matButton="filled" type="button" [disabled]="busy()" (click)="save()">
        Save pattern
      </button>
    </div>
  </div>

  @if (busy()) {
    <mat-progress-bar mode="indeterminate" aria-label="Loading the trading pattern" />
  }

  @if (facade.hasError()) {
    <div
      class="flex items-center gap-3 rounded-large border border-outline-variant p-4 text-body-medium"
      role="alert"
    >
      <mat-icon class="text-error">error</mat-icon>
      <span class="flex-1">{{ facade.error() }}</span>
      <button matButton type="button" (click)="facade.load()">Retry</button>
    </div>
  } @else {
    <div class="form-card">
      <md-market-schedule-form
        [form]="form"
        [gaps]="gaps()"
        [durationMinutes]="facade.schedule()?.duration ?? 0"
      />
    </div>

    @if (facade.saveError(); as saveError) {
      <p class="m-0 text-body-medium text-error" role="alert">{{ saveError }}</p>
    }
  }
</div>
