<md-page-header [heading]="heading()" backLink="/vendors" breadcrumb="Vendors">
  <button matButton="outlined" type="button" disabled matTooltip="Messaging is coming soon">
    Message vendor
  </button>
  <button matIconButton type="button" aria-label="More vendor actions" [matMenuTriggerFor]="more">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #more="matMenu">
    <button mat-menu-item type="button" disabled>Add to a market</button>
    <button mat-menu-item type="button" disabled>Export vendor record</button>
    <button mat-menu-item type="button" disabled>Suspend vendor</button>
  </mat-menu>
</md-page-header>

@if (facade.isLoading()) {
  <mat-progress-bar mode="indeterminate" aria-label="Loading vendor" />
}

@if (facade.hasError()) {
  <div class="mx-auto w-full max-w-[1200px] px-6 py-5">
    <div
      class="flex items-center gap-3 rounded-large border border-outline-variant p-4 text-body-medium"
      role="alert"
    >
      <mat-icon class="text-error">error</mat-icon>
      <span class="flex-1">{{ facade.error() }}</span>
      <a matButton routerLink="/vendors">Back to vendors</a>
    </div>
  </div>
}

@if (vendor(); as data) {
  <div class="identity">
    <div class="flex items-start gap-4">
      <md-avatar [name]="data.name" [size]="64" shape="rounded" />
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-2.5">
          <h2 class="m-0 text-headline-small font-bold text-on-surface">{{ data.name }}</h2>
          @for (badge of data.badges; track badge.label) {
            <md-status-pill [tone]="badge.tone">{{ badge.label }}</md-status-pill>
          }
        </div>
        <p class="mt-1 mb-0 text-label-large text-on-surface-variant">{{ data.meta }}</p>
      </div>
    </div>

    <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="tabs">
      <a
        mat-tab-link
        routerLink="profile"
        routerLinkActive
        #profile="routerLinkActive"
        [active]="profile.isActive"
      >
        Profile
      </a>
      <a
        mat-tab-link
        routerLink="markets"
        routerLinkActive
        #markets="routerLinkActive"
        [active]="markets.isActive"
      >
        <span matBadge="{{ data.membershipCount }}" matBadgeOverlap="false">Markets</span>
      </a>
      <a
        mat-tab-link
        routerLink="staff"
        routerLinkActive
        #staff="routerLinkActive"
        [active]="staff.isActive"
      >
        <span matBadge="{{ data.staffCount }}" matBadgeOverlap="false">Staff</span>
      </a>
      <a
        mat-tab-link
        routerLink="products"
        routerLinkActive
        #products="routerLinkActive"
        [active]="products.isActive"
      >
        <span matBadge="{{ data.productCount }}" matBadgeOverlap="false">Products</span>
      </a>
      <a
        mat-tab-link
        routerLink="payments"
        routerLinkActive
        #payments="routerLinkActive"
        [active]="payments.isActive"
      >
        Payments
      </a>
      <a mat-tab-link disabled matTooltip="Coming soon">Documents</a>
      <a
        mat-tab-link
        routerLink="activity"
        routerLinkActive
        #activity="routerLinkActive"
        [active]="activity.isActive"
      >
        Activity
      </a>
    </nav>
  </div>

  <mat-tab-nav-panel #tabPanel class="panel">
    <router-outlet />
  </mat-tab-nav-panel>
}
